        {% endif %}
        <h1>{{ page.title }}</h1>
        {% if page.subtitle %}
          <p class="chapter-subtitle">{{ page.subtitle }}</p>
        {% endif %}
      </header>
      <div class="chapter-content">
        {{ content }}
      </div>
      <nav class="chapter-navigation" aria-label="章节导航">
        {% if page.previous %}
          <a href="{{ page.previous | relative_url }}">
            ← 上一章
          </a>
        {% else %}
          <span class="chapter-navigation-disabled">
            ← 上一章
          </span>
        {% endif %}
        <a href="{{ catalog_url | relative_url }}">
          章节目录
        </a>
        {% if page.next %}
          <a href="{{ page.next | relative_url }}">
            下一章 →
          </a>
        {% else %}
          <span class="chapter-navigation-disabled">
            下一章 →
            </span>
        {% endif %}
      </nav>
    </article>
  </main>
</body>
</html>
